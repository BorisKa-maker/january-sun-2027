function overview(){
  let h = `<div class="card"><h2>${esc(V.name)}</h2><div class="meta">${esc(V.short || "")}</div><p>${esc(V.summary || "")}</p>${V.notes ? `<p class="meta">${esc(V.notes)}</p>` : ""}</div>`;
  if ((V.flights || []).length) h += `<div class="card"><h3>${L.flights}</h3><table>${V.flights.map(f => `<tr><td><b>${esc(f.name)}</b> ${f.tag ? `<span class="pill acc">${esc(f.tag)}</span>` : ""}<br>${esc(f.out || "")}<br>${esc(f.back || "")}<br><span class="meta">${esc(f.price || "")}</span></td><td class="links">${srcLinks(f.links)}</td></tr>`).join("")}</table>${V.flight_note ? `<p class="meta">${esc(V.flight_note)}</p>` : ""}</div>`;
  if (V.budget) h += `<div class="card"><h3>${L.budget}</h3><table>${(V.budget.rows || []).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${typeof v === "number" ? money(v) : esc(String(v).match(/\d/) && !String(v).includes(CUR) ? CUR + v : v)}</td></tr>`).join("")}<tr><td><b>${L.total}</b></td><td><b>${(V.budget.total || []).map(money).join(" – ")}</b></td></tr></table>${V.budget.note ? `<p class="meta">${esc(V.budget.note)}</p>` : ""}</div>`;
  const bases = [...new Set((V.days || []).map(d => d.base).filter(Boolean))];
  h += `<h2>${L.stays}</h2>`;
  bases.forEach(b => {
    const list = STAYS.filter(s => s.base === b && (!s.variants || s.variants.includes(V.id))).sort((x, y) => ((V.stay_picks || []).includes(y.id) - (V.stay_picks || []).includes(x.id)) || ((x.availability !== "available") - (y.availability !== "available")) || ((x.price_night_total || 1e9) - (y.price_night_total || 1e9)));
    if (list.length) h += `<h3>${esc(baseName(b))}</h3><div class="grid">${list.map(stayCard).join("")}</div>`;
  });
  if ((T.tips || []).length) h += `<div class="card"><h3>${L.tips}</h3><ul>${T.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
  return h;
}
function day(i){
  const d = (V.days || [])[i], opts = d.options || [], k = V.id + d.date, oi = Math.min(OPT[k] || 0, Math.max(opts.length - 1, 0)), o = opts[oi] || {plan: []};
  let h = `<div class="card"><h2>${fmtDate(d.date)} · ${esc(d.title || "")}</h2><div class="meta">${esc(baseName(d.base))}</div>`;
  if (opts.length > 1) h += `<div class="filters opts">${opts.map((x, j) => `<button data-oi="${j}" class="${j === oi ? "on" : ""}">${L.option} ${j + 1}: ${esc(x.title)}</button>`).join("")}</div>`;
  if (o.summary) h += `<p>${esc(o.summary)}</p>`;
  h += `<ul class="plan">${(o.plan || []).map(([t, txt, place, aid]) => `<li><span class="t">${esc(t)}</span><span>${esc(txt)}${place ? ` <span class="local">${esc(place)}</span>` : ""}${aid && ACT[aid] ? ` <a class="more" href="#${esc(V.id)}/${ACT[aid].kind === "walk" ? "walks" : "acts"}:${esc(aid)}">→ ${esc(ACT[aid].name)}</a>` : ""}</span></li>`).join("")}</ul>`;
  const used = [...new Set((o.plan || []).map(p => p[3]).filter(a => ACT[a]))];
  h += `</div>`;
  if (used.length) h += used.map(a => vidStrip("act:" + a)).join("");
  const food = FOOD.filter(f => (f.days || []).includes(d.date) && (!f.variants || f.variants.includes(V.id)));
  if (food.length) h += `<h3>${L.eat}</h3>${foodFilters(food)}<div class="grid">${food.map(foodCard).join("")}</div>`;
  return h;
}
function tabs(k){
  const t = [["overview", L.overview, L.overviewSub], ["acts", L.acts, L.actsSub]];
  if (ACTS.some(a => a.kind === "walk")) t.push(["walks", L.walks, L.walksSub]);
  if (FOOD.length) t.push(["food", L.food, L.foodSub]);
  (V.days || []).forEach(d => t.push([d.date, fmtDate(d.date), d.title || ""]));
  document.getElementById("tabs").innerHTML = t.map(([id, a, b]) => `<button class="tab ${id === k ? "on" : ""}" data-k="${id}">${esc(a)}<small>${esc(b)}</small></button>`).join("");
}
function render(k){
  VSEEN = new Set();
  let [kk, anchor] = (k || "overview").split(":");
  if (anchor && ACT[anchor]) { kk = ACT[anchor].kind === "walk" ? "walks" : "acts"; CITY[kk] = ACT[anchor].base; }
  const i = (V.days || []).findIndex(d => d.date === kk);
  document.getElementById("variants").innerHTML = T.variants.length > 1 ? T.variants.map(v => `<button data-v="${esc(v.id)}" class="${v === V ? "on" : ""}">${esc(v.name)}<small>${esc(v.short || "")}</small></button>`).join("") : "";
  tabs(kk);
  document.getElementById("main").innerHTML = kk === "acts" ? acts() : kk === "walks" ? walks() : kk === "food" ? foodTab() : i >= 0 ? day(i) : overview();
  document.querySelectorAll("#main .ffilt").forEach(r => r.onclick = e => { const b = e.target.closest("button"); if (!b) return; r.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); applyFoodFilters(); });
  applyFoodFilters();
  if (anchor) setTimeout(() => document.getElementById("act-" + anchor)?.scrollIntoView({block: "start"}), 0);
  document.querySelector(".tab.on")?.scrollIntoView({block: "nearest", inline: "center"});
}
function fromHash(){
  const [vid, ...rest] = location.hash.slice(1).split("/");
  V = T.variants.find(v => v.id === vid) || T.variants[0];
  render(rest.join("/"));
}
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest(".tab"); if (tab) { location.hash = V.id + "/" + tab.dataset.k; return; }
  const vb = t.closest(".variants button"); if (vb) { const k = location.hash.split("/").slice(1).join("/") || "overview"; const nv = T.variants.find(v => v.id === vb.dataset.v); location.hash = vb.dataset.v + "/" + ((nv.days || []).some(d => d.date === k) || ["overview", "acts", "walks", "food"].includes(k.split(":")[0]) ? k : "overview"); return; }
  const ob = t.closest(".opts button"); if (ob) { OPT[V.id + location.hash.split("/")[1]] = +ob.dataset.oi; render(location.hash.split("/")[1]); return; }
  const ca = t.closest("a[data-opt]"); if (ca) { OPT[V.id + ca.dataset.date] = +ca.dataset.opt; }
  const cb = t.closest(".citytabs button"); if (cb) { CITY[cb.parentElement.dataset.view] = cb.dataset.b; render(location.hash.split("/")[1]); return; }
  const cf = t.closest("#cf button"); if (cf) { cf.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === cf)); document.querySelectorAll(".card.act").forEach(c => c.style.display = cf.dataset.c === "all" || c.dataset.cat === cf.dataset.c ? "" : "none"); return; }
  const cp = t.closest("button.copy"); if (cp) { navigator.clipboard?.writeText(cp.dataset.copy); cp.textContent = "✓"; return; }
  const ph = t.closest(".photos .ph"); if (ph) { LB.list = JSON.parse(ph.parentElement.dataset.ph); LB.i = +ph.dataset.i; lb(); document.getElementById("lb").classList.add("on"); }
});
const LB = {list: [], i: 0};
function lb(){ const el = document.getElementById("lb"), p = LB.list[LB.i]; el.querySelector("img").src = p.url; el.querySelector(".cnt").textContent = `${LB.i + 1} / ${LB.list.length}${p.caption ? " · " + p.caption : ""}`; }
document.querySelector("#lb .prev").onclick = () => { LB.i = (LB.i + LB.list.length - 1) % LB.list.length; lb(); };
document.querySelector("#lb .next").onclick = () => { LB.i = (LB.i + 1) % LB.list.length; lb(); };
document.querySelector("#lb .close").onclick = () => document.getElementById("lb").classList.remove("on");
document.addEventListener("keydown", e => { if (!document.getElementById("lb").classList.contains("on")) return; if (e.key === "Escape") document.querySelector("#lb .close").click(); if (e.key === "ArrowRight") document.querySelector("#lb .next").click(); if (e.key === "ArrowLeft") document.querySelector("#lb .prev").click(); });
document.documentElement.lang = T.lang || "ru";
document.title = T.title;
document.getElementById("h1").textContent = T.title;
document.getElementById("dates").textContent = T.subtitle || "";
if (T.updated) document.getElementById("upd").textContent = `${L.updated}: ${T.updated.split("-").reverse().join(".")}`;
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
